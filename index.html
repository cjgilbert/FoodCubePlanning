let currentMonth = "feb";

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function renderZone(z) {
  return `<div class="zone" style="background:${z.bg};border-color:${z.color}">${esc(z.name)}</div>`;
}

function renderCube(data, isSlim) {
  let html = `<div class="cube${isSlim ? " slim" : ""}">`;
  html += `<div style="margin-bottom:4px"><div class="cube-label">${esc(data.label)}</div><div class="cube-sub">${esc(data.sub)}</div></div>`;
  if (data.shade) html += `<div class="shade-tag">\u2602\ufe0f SHADE NET</div>`;
  html += `<div class="back-label${isSlim ? " slim" : ""}">${data.backLabel ? esc(data.backLabel) : (isSlim ? "" : "\u00a0")}</div>`;
  html += `<div class="cube-box ${isSlim ? "slim" : "full"}">`;
  for (const row of data.rows) {
    html += `<div class="zone-row" style="flex:${row.flex}">`;
    if (row.type === "split") {
      html += renderZone(row.left) + renderZone(row.right);
    } else {
      html += renderZone(row);
    }
    html += "</div>";
  }
  html += "</div>";
  if (data.frontLabel) html += `<div class="front-label">${esc(data.frontLabel)}</div>`;
  html += "</div>";
  return html;
}

function render() {
  const data = layouts[currentMonth];
  const mi = months.find(m => m.id === currentMonth);

  // Buttons
  document.getElementById("monthBtns").innerHTML = months.map(m =>
    `<button class="month-btn${m.id === currentMonth ? " active" : ""}" data-id="${m.id}">${m.label}</button>`
  ).join("");

  // Info
  document.getElementById("infoBox").innerHTML =
    `<div class="info-title">${mi.full}</div>` +
    `<div class="info-note">${esc(data.note)}</div>` +
    `<div class="todo-box"><b>To-do: </b>${esc(data.todo)}</div>`;

  // Cubes A B C
  document.getElementById("cubeRow").innerHTML =
    renderCube(data.cubes.A) + renderCube(data.cubes.B) + renderCube(data.cubes.C);

  // Cube D
  document.getElementById("cubeDRow").innerHTML = renderCube(data.cubes.D, true);
}

document.getElementById("monthBtns").addEventListener("click", e => {
  const btn = e.target.closest("[data-id]");
  if (btn) { currentMonth = btn.dataset.id; render(); }
});

render();
</script>
